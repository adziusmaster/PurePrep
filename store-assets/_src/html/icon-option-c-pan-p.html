<!doctype html><html lang="en"><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap');
:root{--ink:#f4f1e8;--muted:#8e9a8b;--line:#30402d;--panel:#182018;--panel2:#202b1e;--lime:#b7df78;--lime-dark:#172313;--orange:#ee9b5a;}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
html,body{margin:0;padding:0;}
body{background:#0c100d;color:var(--ink);font-family:Manrope,sans-serif;overflow:hidden;}
.grid-bg:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;
  background-image:linear-gradient(rgba(183,223,120,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(183,223,120,.06) 1px,transparent 1px);
  background-size:56px 56px;mask-image:linear-gradient(to bottom,black,transparent 82%);}
.eyebrow{font:500 clamp(11px,1.5vw,15px) 'DM Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--lime);}
.mono{font-family:'DM Mono',monospace;}

html,body{width:512px;height:512px;}
body:before{display:none;}
</style></head><body class="grid-bg">
<div style="position:absolute;inset:0;background:radial-gradient(90% 90% at 50% 38%, #18231a 0%, #0C100D 70%);"></div>
<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
<svg width="400" height="400" viewBox="28 0 400 400">
  <!-- steam rising off the pan -->
  <g stroke="#A7D46F" stroke-width="15" stroke-linecap="round" fill="none">
    <path d="M196 76 c -11 -13, 11 -22, 0 -38"/>
    <path d="M230 70 c -11 -14, 11 -24, 0 -42"/>
    <path d="M264 76 c -11 -13, 11 -22, 0 -38"/>
  </g>
  <!-- handle = the P's stem, with a hanging hole -->
  <rect x="130" y="196" width="50" height="180" rx="25" fill="#A7D46F"/>
  <circle cx="155" cy="350" r="9" fill="#0C100D"/>
  <!-- pan = the P's bowl -->
  <circle cx="230" cy="196" r="100" fill="#A7D46F"/>
  <circle cx="230" cy="196" r="68" fill="#1b2616"/>
</svg></div></body></html>
